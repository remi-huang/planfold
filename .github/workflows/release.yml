name: Release

# Publishes the files in release/ as a draft GitHub release named after manifest.json's version (e.g. 1.0.0, no "v").
# Runs when release/ or manifest.json changes on main, or by hand from the Actions tab (Run workflow).
# A draft with the same version is replaced; a published release is never touched (bump the version instead).
on:
  push:
    branches: [main]
    paths: [manifest.json, "release/**", .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files
        run: |
          VERSION="$(jq -r .version manifest.json)"
          test "$(jq -r .version release/manifest.json)" = "$VERSION"
          test -s release/main.js && test -s release/styles.css
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            if [ "$(gh release view "$VERSION" --json isDraft -q .isDraft)" = "true" ]; then
              gh release delete "$VERSION" --yes --cleanup-tag
            else
              echo "Release $VERSION is already published — bump the version to release again."; exit 0
            fi
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --draft \
            --notes "Planfold $VERSION" \
            release/main.js release/manifest.json release/styles.css
